<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>برای ماهی ❤️</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    min-width: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    position: fixed;
    inset: 0;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    background:
        linear-gradient(
            rgba(0,0,0,.18),
            rgba(0,0,0,.18)
        ),
        url("background.jpg");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}


/* =====================================
   شروع
===================================== */

.intro {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 100;

    background:
        rgba(0,0,0,.38);

    display: flex;
    align-items: center;
    justify-content: center;

    pointer-events: none;

    animation:
        introOut 1.2s ease forwards;

    animation-delay: 1.8s;
}

.loading {
    color: white;
    font-size: 24px;
    letter-spacing: 6px;

    animation:
        loadingPulse 1s infinite;
}

@keyframes loadingPulse {

    0%,100% {
        opacity: .25;
    }

    50% {
        opacity: 1;
    }
}

@keyframes introOut {

    from {
        opacity: 1;
    }

    to {
        opacity: 0;
        visibility: hidden;
    }
}


/* =====================================
   کادر اصلی
===================================== */

.main-card {

    position: fixed;

    width: min(88%, 720px);

    min-height: 250px;

    left: 50%;
    top: 11%;

    transform:
        translateX(-50%)
        scale(.7);

    padding:
        35px 40px;

    border-radius: 30px;

    background:
        rgba(255,255,255,.13);

    border:
        1px solid
        rgba(255,255,255,.48);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    box-shadow:

        0 25px 70px
        rgba(0,0,0,.28),

        inset 0 1px 0
        rgba(255,255,255,.55),

        inset 0 -1px 0
        rgba(255,255,255,.15);

    display: flex;

    justify-content: center;
    align-items: center;

    text-align: center;

    z-index: 10;

    opacity: 0;

    animation:
        cardAppear 1.3s
        cubic-bezier(.2,.8,.2,1)
        forwards;

    animation-delay: 1.5s;

    overflow: hidden;
}

.main-card::before {

    content: "";

    position: absolute;

    inset: 0;

    border-radius: inherit;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.14),
            transparent 35%,
            transparent 65%,
            rgba(255,255,255,.08)
        );

    pointer-events: none;
}

.main-card::after {

    content: "";

    position: absolute;

    width: 180%;
    height: 50%;

    left: -40%;
    top: -20%;

    transform:
        rotate(-12deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.14),
            transparent
        );

    animation:
        shine 6s infinite;

    pointer-events: none;
}

@keyframes shine {

    0% {
        transform:
            translateX(-40%)
            rotate(-12deg);
    }

    50% {
        transform:
            translateX(40%)
            rotate(-12deg);
    }

    100% {
        transform:
            translateX(40%)
            rotate(-12deg);
    }
}

@keyframes cardAppear {

    from {

        opacity: 0;

        transform:
            translateX(-50%)
            scale(.7);
    }

    to {

        opacity: 1;

        transform:
            translateX(-50%)
            scale(1);
    }
}


/* =====================================
   متن
===================================== */

.typing {

    position: relative;

    z-index: 2;

    width: 100%;

    color: white;

    font-size:
        clamp(20px,4vw,32px);

    font-weight: bold;

    line-height: 2;

    text-align: center;

    white-space: normal;
}

.cursor {

    display: inline-block;

    margin-right: 4px;

    animation:
        cursorBlink .7s infinite;
}

@keyframes cursorBlink {

    0%,50% {
        opacity: 1;
    }

    51%,100% {
        opacity: 0;
    }
}


/* =====================================
   گزینه‌ها
===================================== */

.options {

    position: fixed;

    left: 50%;

    top: 58%;

    transform:
        translateX(-50%);

    width: min(88%, 650px);

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 14px;

    z-index: 20;

    opacity: 0;

    animation:
        optionsAppear 1s
        ease forwards;

    animation-delay: 5.5s;
}

@keyframes optionsAppear {

    from {

        opacity: 0;

        transform:
            translateX(-50%)
            translateY(30px);
    }

    to {

        opacity: 1;

        transform:
            translateX(-50%)
            translateY(0);
    }
}


/* =====================================
   گزینه
===================================== */

.option {

    position: relative;

    width: 100%;

    height: 68px;

    border:
        1px solid
        rgba(255,255,255,.55);

    border-radius: 20px;

    background:
        rgba(255,255,255,.78);

    color: #222;

    font-family: inherit;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    overflow: hidden;

    box-shadow:
        0 12px 30px
        rgba(0,0,0,.22);

    transition:
        transform .25s ease,
        background .3s ease,
        opacity .3s ease;
}

.option:hover {

    transform:
        translateY(-4px);

    background:
        rgba(255,255,255,.92);
}

.option:active {

    transform:
        scale(.96);
}


/* =====================================
   قفل
===================================== */

.option.locked {

    cursor: not-allowed;

    background:
        rgba(255,255,255,.35);

    color:
        rgba(255,255,255,.75);

    border:
        1px solid
        rgba(255,255,255,.45);

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.18);

    transform:
        none;
}


/* =====================================
   زنجیر
===================================== */

.chain {

    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 7px;

    opacity: 0;

    transform:
        scale(.4)
        rotate(-10deg);

    pointer-events: none;
}

.option.locked .chain {

    opacity: 1;

    animation:
        chainAppear .45s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}

@keyframes chainAppear {

    0% {

        opacity: 0;

        transform:
            scale(.4)
            rotate(-10deg);
    }

    70% {

        opacity: 1;

        transform:
            scale(1.08)
            rotate(3deg);
    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            rotate(0);
    }
}


/* =====================================
   حلقه‌های زنجیر
===================================== */

.chain span {

    width: 18px;

    height: 28px;

    border:
        4px solid
        rgba(255,255,255,.95);

    border-radius: 50%;

    transform:
        rotate(25deg);

    filter:
        drop-shadow(
            0 3px 5px
            rgba(0,0,0,.35)
        );
}


/* =====================================
   LOCKED
===================================== */

.locked-text {

    position: absolute;

    bottom: 7px;

    left: 50%;

    transform:
        translateX(-50%);

    font-size: 10px;

    letter-spacing: 2px;

    color: white;

    opacity: 0;

    pointer-events: none;
}

.option.locked .locked-text {

    opacity: 1;

    animation:
        lockedText .5s ease forwards;
}

@keyframes lockedText {

    from {

        opacity: 0;

        transform:
            translateX(-50%)
            translateY(5px);
    }

    to {

        opacity: 1;

        transform:
            translateX(-50%)
            translateY(0);
    }
}


/* =====================================
   بارش 🤡
===================================== */

.clown-rain {

    position: fixed;

    top: -60px;

    font-size: 28px;

    z-index: 200;

    pointer-events: none;

    animation:
        clownFall linear forwards;
}

@keyframes clownFall {

    from {

        transform:
            translateY(-60px)
            rotate(0deg);

        opacity: 1;
    }

    to {

        transform:
            translateY(110vh)
            rotate(360deg);

        opacity: .9;
    }
}


/* =====================================
   موبایل
===================================== */

@media(max-width:600px) {

    .main-card {

        top: 9%;

        width: 90%;

        min-height: 220px;

        padding:
            25px 20px;

        border-radius: 25px;
    }

    .typing {

        font-size: 20px;

        line-height: 1.9;
    }

    .options {

        top: 57%;

        width: 90%;

        gap: 11px;
    }

    .option {

        height: 65px;

        border-radius: 17px;

        font-size: 14px;

        padding:
            8px;
    }

    .chain span {

        width: 15px;

        height: 23px;

        border-width: 3px;
    }

    .clown-rain {

        font-size: 24px;
    }
}

</style>

</head>


<body>


<div class="intro">

    <div class="loading">
        ...
    </div>

</div>


<div class="main-card">

    <div class="typing">

        <span id="typingText"></span>

        <span class="cursor">
            |
        </span>

    </div>

</div>


<div class="options">


    <!-- گزینه ۱ -->

    <button
        class="option"
        data-lock>

        آهنگ گوش بدیممم

        <div class="chain">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>

        <div class="locked-text">
            LOCKED
        </div>

    </button>


    <!-- گزینه ۲ -->

    <button
        class="option"
        data-lock>

        بریم اینستا ریلز ببینیم

        <div class="chain">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>

        <div class="locked-text">
            LOCKED
        </div>

    </button>


    <!-- گزینه ۳ -->

    <button
        class="option"
        data-lock>

        راجب اشتباهاتمون حرف بزنیم

        <div class="chain">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>

        <div class="locked-text">
            LOCKED
        </div>

    </button>


    <!-- گزینه ۴ -->

    <button
        id="movieBtn"
        class="option">

        فیلم ببینیم

    </button>


</div>


<script>


/* =====================================
   تایپ متن
===================================== */

const text =
    "مرسی که تصمیم گرفتی با من وقت بگذرونی ❤️\nحالا می‌خوای چطور سرگرم شیم؟؟";

const typingText =
    document.getElementById("typingText");

let index = 0;


function typeWriter() {

    if (index < text.length) {

        const char =
            text.charAt(index);

        if (char === "\n") {

            typingText.appendChild(
                document.createElement("br")
            );

        } else {

            typingText.appendChild(
                document.createTextNode(char)
            );

        }

        index++;

        setTimeout(
            typeWriter,
            65
        );

    }

}


setTimeout(
    typeWriter,
    2700
);


/* =====================================
   بارش 🤡
===================================== */

function clownRain() {

    const duration = 1000;

    const start =
        Date.now();

    const rainInterval =
        setInterval(
            function() {

                if (
                    Date.now() - start >=
                    duration
                ) {

                    clearInterval(
                        rainInterval
                    );

                    return;
                }

                const clown =
                    document.createElement(
                        "div"
                    );

                clown.className =
                    "clown-rain";

                clown.textContent =
                    "🤡";

                clown.style.left =
                    Math.random() * 100 +
                    "vw";

                clown.style.animationDuration =
                    (0.7 + Math.random() * 0.7) +
                    "s";

                document.body.appendChild(
                    clown
                );

                setTimeout(
                    function() {

                        clown.remove();

                    },
                    1600
                );

            },
            45
        );
}


/* =====================================
   گزینه‌های ممنوع
===================================== */

const lockButtons =
    document.querySelectorAll(
        "[data-lock]"
    );


lockButtons.forEach(
    function(button) {

        button.addEventListener(
            "click",
            function() {

                if (
                    button.classList.contains(
                        "locked"
                    )
                ) {

                    return;

                }


                /*
                 * اول قفل می‌شود
                 */

                button.classList.add(
                    "locked"
                );


                /*
                 * بعد دلقک‌ها می‌بارند
                 */

                clownRain();

            }
        );

    }
);


/* =====================================
   گزینه فیلم
===================================== */

const movieBtn =
    document.getElementById(
        "movieBtn"
    );


movieBtn.addEventListener(
    "click",
    function() {

        movieBtn.style.transform =
            "scale(.94)";

        setTimeout(
            function() {

                window.location.href =
                    "page3.html";

            },
            220
        );

    }
);

</script>

</body>

  </html>

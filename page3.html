<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>برای ماهی ❤️</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    min-width: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    position: fixed;
    inset: 0;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    background:
        linear-gradient(
            rgba(0,0,0,.18),
            rgba(0,0,0,.18)
        ),
        url("background.jpg");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}


/* =====================================
   شروع
===================================== */

.intro {

    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 100;

    background:
        rgba(0,0,0,.38);

    display: flex;

    align-items: center;
    justify-content: center;

    pointer-events: none;

    animation:
        introOut 1.2s ease forwards;

    animation-delay: 1.8s;
}

.loading {

    color: white;

    font-size: 24px;

    letter-spacing: 6px;

    animation:
        loadingPulse 1s infinite;
}

@keyframes loadingPulse {

    0%,100% {
        opacity: .25;
    }

    50% {
        opacity: 1;
    }
}

@keyframes introOut {

    from {
        opacity: 1;
    }

    to {
        opacity: 0;
        visibility: hidden;
    }
}


/* =====================================
   کادر اصلی
===================================== */

.main-card {

    position: fixed;

    width: min(88%, 720px);

    height: 230px;

    left: 50%;

    top: 7%;

    transform:
        translateX(-50%)
        scale(.7);

    padding:
        35px 40px;

    border-radius: 30px;

    background:
        rgba(255,255,255,.13);

    border:
        1px solid
        rgba(255,255,255,.48);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    box-shadow:

        0 25px 70px
        rgba(0,0,0,.28),

        inset 0 1px 0
        rgba(255,255,255,.55),

        inset 0 -1px 0
        rgba(255,255,255,.15);

    display: flex;

    justify-content: center;
    align-items: center;

    text-align: center;

    z-index: 10;

    opacity: 0;

    animation:
        cardAppear 1.3s
        cubic-bezier(.2,.8,.2,1)
        forwards;

    animation-delay: 1.5s;

    overflow: hidden;
}

.main-card::before {

    content: "";

    position: absolute;

    inset: 0;

    border-radius: inherit;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.14),
            transparent 35%,
            transparent 65%,
            rgba(255,255,255,.08)
        );

    pointer-events: none;
}

.main-card::after {

    content: "";

    position: absolute;

    width: 180%;

    height: 50%;

    left: -40%;

    top: -20%;

    transform:
        rotate(-12deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.14),
            transparent
        );

    animation:
        shine 6s infinite;

    pointer-events: none;
}

@keyframes shine {

    0% {
        transform:
            translateX(-40%)
            rotate(-12deg);
    }

    50% {
        transform:
            translateX(40%)
            rotate(-12deg);
    }

    100% {
        transform:
            translateX(40%)
            rotate(-12deg);
    }
}

@keyframes cardAppear {

    from {

        opacity: 0;

        transform:
            translateX(-50%)
            scale(.7);
    }

    to {

        opacity: 1;

        transform:
            translateX(-50%)
            scale(1);
    }
}


/* =====================================
   متن
===================================== */

.typing {

    position: relative;

    z-index: 2;

    width: 100%;

    color: white;

    font-size:
        clamp(18px,3.5vw,29px);

    font-weight: bold;

    line-height: 1.9;

    text-align: center;

    text-shadow:
        0 3px 18px
        rgba(0,0,0,.38);

    min-height: 55px;
}

.cursor {

    display: inline-block;

    margin-right: 4px;

    animation:
        cursorBlink .7s infinite;
}

@keyframes cursorBlink {

    0%,50% {
        opacity: 1;
    }

    51%,100% {
        opacity: 0;
    }
}


/* =====================================
   کارت‌های فیلم
===================================== */

.movies {

    position: fixed;

    left: 50%;

    top: 43%;

    transform:
        translateX(-50%);

    width: min(90%, 700px);

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 14px;

    z-index: 20;

    opacity: 0;

    animation:
        moviesAppear 1s
        cubic-bezier(.2,.8,.2,1)
        forwards;

    animation-delay: 8.5s;
}

@keyframes moviesAppear {

    from {

        opacity: 0;

        transform:
            translateX(-50%)
            translateY(35px)
            scale(.92);
    }

    to {

        opacity: 1;

        transform:
            translateX(-50%)
            translateY(0)
            scale(1);
    }
}


/* =====================================
   کارت فیلم
===================================== */

.movie {

    position: relative;

    height: 190px;

    padding: 8px;

    border-radius: 22px;

    border:
        1px solid
        rgba(255,255,255,.55);

    background:
        rgba(255,255,255,.15);

    backdrop-filter:
        blur(14px);

    -webkit-backdrop-filter:
        blur(14px);

    box-shadow:

        0 15px 35px
        rgba(0,0,0,.25),

        inset 0 1px 0
        rgba(255,255,255,.4);

    cursor: pointer;

    overflow: hidden;

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}

.movie:hover {

    transform:
        translateY(-6px)
        scale(1.02);

    box-shadow:
        0 22px 45px
        rgba(0,0,0,.35);
}

.movie:active {

    transform:
        scale(.95);
}


/* =====================================
   پوستر
===================================== */

.movie img {

    display: block;

    width: 100%;

    height: 145px;

    object-fit: cover;

    border-radius: 16px;

    box-shadow:
        0 8px 20px
        rgba(0,0,0,.25);
}


/* =====================================
   اسم فیلم
===================================== */

.movie-name {

    height: 35px;

    display: flex;

    align-items: center;

    justify-content: center;

    color: white;

    font-size: 16px;

    font-weight: bold;

    text-shadow:
        0 2px 8px
        rgba(0,0,0,.5);
}


/* =====================================
   افکت نور
===================================== */

.movie::after {

    content: "";

    position: absolute;

    width: 150%;

    height: 40%;

    left: -25%;

    top: -60%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.22),
            transparent
        );

    transform:
        rotate(-15deg);

    transition:
        top .7s ease;

    pointer-events: none;
}

.movie:hover::after {

    top: 120%;
}


/* =====================================
   موبایل
===================================== */

@media(max-width:600px) {

    .main-card {

        top: 6%;

        width: 90%;

        height: 220px;

        padding:
            25px 20px;

        border-radius: 25px;
    }

    .typing {

        font-size: 18px;

        line-height: 1.9;
    }

    .movies {

        top: 42%;

        width: 90%;

        gap: 11px;
    }

    .movie {

        height: 175px;

        padding: 7px;

        border-radius: 18px;
    }

    .movie img {

        height: 132px;

        border-radius: 13px;
    }

    .movie-name {

        height: 31px;

        font-size: 14px;
    }

}

</style>

</head>


<body>


<!-- =====================================
     شروع
===================================== -->

<div class="intro">

    <div class="loading">
        ...
    </div>

</div>


<!-- =====================================
     کادر متن
===================================== -->

<div class="main-card">

    <div class="typing">

        <span id="typingText"></span>

        <span class="cursor">
            |
        </span>

    </div>

</div>


<!-- =====================================
     فیلم‌ها
===================================== -->

<div class="movies">


    <!-- Obsession -->

    <div
        class="movie"
        data-page="page4.html">

        <img
            src="obsession.jpg"
            alt="Obsession">

        <div class="movie-name">
            Obsession
        </div>

    </div>


    <!-- Star Wars Episode I -->

    <div
        class="movie"
        data-page="page4.html">

        <img
            src="starwars.jpg"
            alt="Star Wars Episode I">

        <div class="movie-name">
            Starwars
        </div>

    </div>


    <!-- Good Omens -->

    <div
        class="movie"
        data-page="page4.html">

        <img
            src="goodomens.jpg"
            alt="Good Omens">

        <div class="movie-name">
            Good Omens
        </div>

    </div>


    <!-- Titanic -->

    <div
        class="movie"
        data-page="page4.html">

        <img
            src="titanic.jpg"
            alt="Titanic">

        <div class="movie-name">
            Titanic
        </div>

    </div>


</div>


<script>

/* =====================================
   متن‌های مرحله‌ای
===================================== */

const messages = [

    "وای ماهی چقدر خوبه که جفتمون یه چیز میخوایم🥺❤️",

    "حالا انتخاب کن چه فیلمی ببینیم",

    "این بار شوخی نیست😂😂",

    "تو آزادی هر فیلمی میخوای انتخاب کنی❤️"

];


const typingText =
    document.getElementById("typingText");


let messageIndex = 0;

let letterIndex = 0;


/* =====================================
   تایپ متن
===================================== */

function typeMessage() {

    const currentMessage =
        messages[messageIndex];


    if (
        letterIndex <
        currentMessage.length
    ) {

        typingText.textContent +=
            currentMessage.charAt(letterIndex);

        letterIndex++;

        setTimeout(
            typeMessage,
            55
        );

        return;
    }


    /*
     * اگر هنوز جمله دیگری مانده:
     *
     * کمی مکث
     * پاک شدن متن
     * شروع جمله بعدی
     */

    if (
        messageIndex <
        messages.length - 1
    ) {

        setTimeout(
            function() {

                typingText.textContent = "";

                letterIndex = 0;

                messageIndex++;

                typeMessage();

            },
            1100
        );

    }

    /*
     * اگر به آخرین جمله رسیدیم:
     *
     * هیچ کاری نمی‌کنیم.
     *
     * متن همان‌جا می‌ماند.
     */

}


/* =====================================
   شروع تایپ
===================================== */

setTimeout(
    typeMessage,
    2700
);


/* =====================================
   کلیک روی فیلم‌ها
===================================== */

const movies =
    document.querySelectorAll(".movie");


movies.forEach(
    function(movie) {

        movie.addEventListener(
            "click",
            function() {

                movie.style.transform =
                    "scale(.94)";

                setTimeout(
                    function() {

                        window.location.href =
                            "page4.html";

                    },
                    220
                );

            }
        );

    }
);

</script>

</body>

</html>

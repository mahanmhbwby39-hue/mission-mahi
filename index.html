<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>برای ماهی ❤️</title>

<style>

/* =====================================
   RESET
===================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    overflow: hidden;
    position: relative;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    background:
        linear-gradient(
            rgba(0,0,0,.18),
            rgba(0,0,0,.18)
        ),
        url("background.jpg");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}


/* =====================================
   شروع
===================================== */

.intro {
    position: fixed;
    inset: 0;

    z-index: 100;

    background:
        rgba(0,0,0,.38);

    display: flex;
    align-items: center;
    justify-content: center;

    pointer-events: none;

    animation:
        introOut 1.2s ease forwards;

    animation-delay: 1.8s;
}

.loading {
    color: white;

    font-size: 24px;

    letter-spacing: 6px;

    animation:
        loadingPulse 1s infinite;
}

@keyframes loadingPulse {

    0%,100% {
        opacity: .25;
    }

    50% {
        opacity: 1;
    }
}

@keyframes introOut {

    from {
        opacity: 1;
    }

    to {
        opacity: 0;
        visibility: hidden;
    }
}


/* =====================================
   حباب‌ها
===================================== */

.bubbles {
    position: absolute;
    inset: 0;

    pointer-events: none;

    z-index: 5;
}

.bubble {
    position: absolute;

    width: 105px;
    height: 105px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            rgba(255,255,255,.85),
            rgba(255,255,255,.18) 35%,
            rgba(255,255,255,.06) 70%,
            rgba(255,255,255,.22)
        );

    border:
        1px solid
        rgba(255,255,255,.55);

    backdrop-filter:
        blur(8px);

    -webkit-backdrop-filter:
        blur(8px);

    box-shadow:
        inset 8px 8px 20px
        rgba(255,255,255,.30),

        inset -10px -10px 20px
        rgba(255,255,255,.08),

        0 10px 35px
        rgba(0,0,0,.18);

    opacity: 0;

    animation-duration: 1.7s;

    animation-fill-mode: forwards;

    animation-timing-function:
        cubic-bezier(.2,.8,.2,1);
}

.b1 {
    left: 8%;
    top: 8%;
    animation-name: bubble1;
}

.b2 {
    left: 25%;
    top: 3%;
    animation-name: bubble2;
}

.b3 {
    right: 8%;
    top: 8%;
    animation-name: bubble3;
}

.b4 {
    right: 25%;
    top: 3%;
    animation-name: bubble4;
}

.b5 {
    left: 5%;
    top: 38%;
    animation-name: bubble5;
}

.b6 {
    right: 5%;
    top: 38%;
    animation-name: bubble6;
}

.b7 {
    left: 20%;
    top: 31%;
    animation-name: bubble7;
}

.b8 {
    right: 20%;
    top: 31%;
    animation-name: bubble8;
}


/* =====================================
   انیمیشن حباب‌ها
===================================== */

@keyframes bubble1 {

    from {
        transform:
            translate(-150px,-100px)
            scale(.2);

        opacity: 0;
    }

    to {
        transform:
            translate(0,0)
            scale(1);

        opacity: 1;
    }
}

@keyframes bubble2 {

    from {
        transform:
            translate(-100px,-150px)
            scale(.2);

        opacity: 0;
    }

    to {
        transform:
            translate(0,0)
            scale(1);

        opacity: 1;
    }
}

@keyframes bubble3 {

    from {
        transform:
            translate(150px,-100px)
            scale(.2);

        opacity: 0;
    }

    to {
        transform:
            translate(0,0)
            scale(1);

        opacity: 1;
    }
}

@keyframes bubble4 {

    from {
        transform:
            translate(100px,-150px)
            scale(.2);

        opacity: 0;
    }

    to {
        transform:
            translate(0,0)
            scale(1);

        opacity: 1;
    }
}

@keyframes bubble5 {

    from {
        transform:
            translate(-170px,50px)
            scale(.2);

        opacity: 0;
    }

    to {
        transform:
            translate(0,0)
            scale(1);

        opacity: 1;
    }
}

@keyframes bubble6 {

    from {
        transform:
            translate(170px,50px)
            scale(.2);

        opacity: 0;
    }

    to {
        transform:
            translate(0,0)
            scale(1);

        opacity: 1;
    }
}

@keyframes bubble7 {

    from {
        transform:
            translate(-100px,100px)
            scale(.2);

        opacity: 0;
    }

    to {
        transform:
            translate(0,0)
            scale(1);

        opacity: 1;
    }
}

@keyframes bubble8 {

    from {
        transform:
            translate(100px,100px)
            scale(.2);

        opacity: 0;
    }

    to {
        transform:
            translate(0,0)
            scale(1);

        opacity: 1;
    }
}


/* =====================================
   پنل اصلی
===================================== */

.main-card {

    position: absolute;

    width: min(86%,700px);

    min-height: 230px;

    left: 50%;

    top: 16%;

    transform:
        translateX(-50%)
        scale(.7);

    padding:
        40px 45px;

    border-radius: 30px;

    background:
        rgba(255,255,255,.13);

    border:
        1px solid
        rgba(255,255,255,.48);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    box-shadow:

        0 25px 70px
        rgba(0,0,0,.28),

        inset 0 1px 0
        rgba(255,255,255,.55),

        inset 0 -1px 0
        rgba(255,255,255,.15);

    display: flex;

    justify-content: center;

    align-items: center;

    text-align: center;

    z-index: 10;

    opacity: 0;

    animation:
        cardAppear 1.3s
        cubic-bezier(.2,.8,.2,1)
        forwards;

    animation-delay: 1.5s;

    overflow: hidden;
}

.main-card::before {

    content: "";

    position: absolute;

    inset: 0;

    border-radius: inherit;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.14),
            transparent 35%,
            transparent 65%,
            rgba(255,255,255,.08)
        );

    pointer-events: none;
}

.main-card::after {

    content: "";

    position: absolute;

    width: 180%;

    height: 50%;

    left: -40%;

    top: -20%;

    transform:
        rotate(-12deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.14),
            transparent
        );

    animation:
        shine 6s infinite;

    pointer-events: none;
}

@keyframes shine {

    0% {
        transform:
            translateX(-40%)
            rotate(-12deg);
    }

    50% {
        transform:
            translateX(40%)
            rotate(-12deg);
    }

    100% {
        transform:
            translateX(40%)
            rotate(-12deg);
    }
}

@keyframes cardAppear {

    from {

        opacity: 0;

        transform:
            translateX(-50%)
            scale(.7);
    }

    to {

        opacity: 1;

        transform:
            translateX(-50%)
            scale(1);
    }
}


/* =====================================
   متن
===================================== */

.typing {

    position: relative;

    z-index: 2;

    color: white;

    font-size:
        clamp(21px,4vw,34px);

    font-weight: bold;

    line-height: 2;

    text-align: center;

    text-shadow:
        0 3px 18px
        rgba(0,0,0,.38);
}

.cursor {

    display: inline-block;

    margin-right: 4px;

    animation:
        cursorBlink .7s infinite;
}

@keyframes cursorBlink {

    0%,50% {
        opacity: 1;
    }

    51%,100% {
        opacity: 0;
    }
}


/* =====================================
   دکمه‌ها
===================================== */

.buttons {

    position: absolute;

    left: 0;
    right: 0;

    bottom: 17%;

    height: 100px;

    z-index: 20;

    pointer-events: none;
}

.btn {

    border: none;

    font-family: inherit;

    font-size: 20px;

    font-weight: bold;

    padding:
        16px 30px;

    border-radius: 18px;

    cursor: pointer;

    color: #222;

    background:
        rgba(255,255,255,.88);

    box-shadow:
        0 12px 30px
        rgba(0,0,0,.25);

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}

.btn:hover {

    transform:
        translateY(-4px)
        scale(1.04);

    box-shadow:
        0 18px 35px
        rgba(0,0,0,.3);
}


/* =====================================
   آره
===================================== */

.yes {

    position: absolute;

    left: 14%;

    top: 50%;

    transform:
        translateY(-50%)
        translateX(-150px);

    opacity: 0;

    animation:
        yesEnter 1s
        cubic-bezier(.2,.8,.2,1)
        forwards;

    animation-delay: 5s;

    pointer-events: auto;
}

@keyframes yesEnter {

    to {

        opacity: 1;

        transform:
            translateY(-50%)
            translateX(0);
    }
}


/* =====================================
   نه
===================================== */

.no-wrapper {

    position: absolute;

    right: 14%;

    top: 50%;

    width: 150px;

    height: 105px;

    transform:
        translateY(-50%)
        translateX(150px);

    opacity: 0;

    animation:
        noEnter 1s
        cubic-bezier(.2,.8,.2,1)
        forwards;

    animation-delay: 5s;

    pointer-events: auto;
}

@keyframes noEnter {

    to {

        opacity: 1;

        transform:
            translateY(-50%)
            translateX(0);
    }
}

.no {

    position: absolute;

    left: 0;

    bottom: 0;

    width: 150px;

    pointer-events: auto;
}


/* =====================================
   ابر دیالوگ
===================================== */

.speech {

    position: absolute;

    bottom: 82px;

    left: 50%;

    transform:
        translateX(-50%)
        scale(.7);

    min-width: 200px;

    max-width: 270px;

    padding:
        12px 17px;

    border-radius: 19px;

    background:
        rgba(255,255,255,.92);

    color: #222;

    font-size: 14px;

    font-weight: bold;

    line-height: 1.7;

    text-align: center;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.22);

    opacity: 0;

    transition:
        .3s ease;

    pointer-events: none;
}

.speech::after {

    content: "";

    position: absolute;

    bottom: -9px;

    left: 50%;

    transform:
        translateX(-50%);

    border-left:
        10px solid transparent;

    border-right:
        10px solid transparent;

    border-top:
        10px solid
        rgba(255,255,255,.92);
}

.speech.show {

    opacity: 1;

    transform:
        translateX(-50%)
        scale(1);
}


/* =====================================
   موبایل
===================================== */

@media(max-width:600px) {

    .main-card {

        top: 13%;

        width: 90%;

        min-height: 200px;

        padding:
            25px 20px;

        border-radius: 25px;
    }

    .typing {

        font-size: 21px;

        line-height: 1.9;
    }

    .buttons {

        bottom: 15%;
    }

    .yes {

        left: 7%;
    }

    .no-wrapper {

        right: 7%;

        width: 130px;
    }

    .no {

        width: 130px;
    }

    .btn {

        font-size: 17px;

        padding:
            14px 20px;
    }

    .speech {

        min-width: 175px;

        max-width: 220px;

        font-size: 13px;
    }

    .bubble {

        width: 80px;

        height: 80px;
    }
}

</style>

</head>


<body>


<!-- =====================================
     شروع
===================================== -->

<div class="intro">

    <div class="loading">
        ...
    </div>

</div>


<!-- =====================================
     حباب‌ها
===================================== -->

<div class="bubbles">

    <span class="bubble b1"></span>

    <span class="bubble b2"></span>

    <span class="bubble b3"></span>

    <span class="bubble b4"></span>

    <span class="bubble b5"></span>

    <span class="bubble b6"></span>

    <span class="bubble b7"></span>

    <span class="bubble b8"></span>

</div>


<!-- =====================================
     پنل
===================================== -->

<div class="main-card">

    <div class="typing">

        <span id="typingText"></span>

        <span class="cursor">
            |
        </span>

    </div>

</div>


<!-- =====================================
     دکمه‌ها
===================================== -->

<div class="buttons">


    <!-- آره -->

    <button
        id="yesBtn"
        class="btn yes">

        آرهههه ♥️

    </button>


    <!-- نه -->

    <div
        id="noWrapper"
        class="no-wrapper">


        <!-- ابر -->

        <div
            id="speech"
            class="speech">

            <span
                id="speechText">
            </span>

        </div>


        <!-- دکمه نه -->

        <button
            id="noBtn"
            class="btn no">

            نه 😐

        </button>

    </div>

</div>


<script>


/* =====================================
   تایپ متن
===================================== */

const text =
    "سلام ماهی جونم، می‌خوای با من وقت بگذرونی؟ ❤️";

const typingText =
    document.getElementById("typingText");

let letter = 0;


function typeWriter() {

    if (letter < text.length) {

        typingText.textContent +=
            text.charAt(letter);

        letter++;

        setTimeout(
            typeWriter,
            75
        );
    }
}


setTimeout(
    typeWriter,
    2700
);


/* =====================================
   دکمه آره
===================================== */

const yesBtn =
    document.getElementById("yesBtn");


yesBtn.addEventListener(
    "click",
    function() {

        yesBtn.style.transform =
            "translateY(-50%) scale(.9)";

        setTimeout(
            function() {

                window.location.href =
                    "page2.html";

            },
            250
        );

    }
);


/* =====================================
   دکمه نه
===================================== */

const noBtn =
    document.getElementById("noBtn");

const noWrapper =
    document.getElementById("noWrapper");

const speech =
    document.getElementById("speech");

const speechText =
    document.getElementById("speechText");


/* =====================================
   دیالوگ‌ها
===================================== */

const messages = [

    "واااا چرا میگی نه 😐💔",

    "چرا قلب دبه دوغتو میشکنی 😭",

    "نگو نه دیگه 🙏🏻",

    "خیلی بدی قهرم باهات 🚫",

    "این گزینه فعلا در دست ساخته لطفا بزن آره"

];


let messageIndex = 0;


/* =====================================
   موقعیت اولیه
===================================== */

let originalX = null;

let originalY = null;


const MOVE_RANGE_X = 90;

const MOVE_RANGE_Y = 55;


/* =====================================
   حرکت دکمه نه
===================================== */

function moveNoButton() {


    /* ذخیره موقعیت اولیه فقط یک بار */

    if (originalX === null) {

        const rect =
            noWrapper.getBoundingClientRect();

        originalX =
            rect.left;

        originalY =
            rect.top;
    }


    /* موقعیت تصادفی */

    const randomX =
        (Math.random() * 2 - 1)
        * MOVE_RANGE_X;

    const randomY =
        (Math.random() * 2 - 1)
        * MOVE_RANGE_Y;


    /* تغییر موقعیت */

    noWrapper.style.position =
        "fixed";

    noWrapper.style.left =
        (originalX + randomX) + "px";

    noWrapper.style.top =
        (originalY + randomY) + "px";

    noWrapper.style.right =
        "auto";

    noWrapper.style.bottom =
        "auto";

    noWrapper.style.transform =
        "translate(0,0)";


    /* انیمیشن کوچک */

    noWrapper.animate(

        [
            {
                transform:
                    "translate(0,0) scale(.85)"
            },

            {
                transform:
                    "translate(0,0) scale(1)"
            }
        ],

        {
            duration: 280,

            easing:
                "ease-out"
        }

    );

}


/* =====================================
   نمایش دیالوگ
===================================== */

function showMessage() {


    /* نمایش دیالوگ فعلی */

    speechText.textContent =
        messages[messageIndex];


    /* رفتن به دیالوگ بعدی */

    messageIndex++;


    /* بعد از آخرین دیالوگ
       برگشت به اول */

    if (
        messageIndex >=
        messages.length
    ) {

        messageIndex = 0;

    }


    /* اجرای دوباره انیمیشن ابر */

    speech.classList.remove(
        "show"
    );

    void speech.offsetWidth;

    speech.classList.add(
        "show"
    );

}


/* =====================================
   کلیک روی نه
===================================== */

noBtn.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        /*
         * هر کلیک دقیقاً:
         *
         * 1. یک دیالوگ جدید
         * 2. همان حرکت قبلی
         *
         */

        showMessage();

        moveNoButton();

    }
);


/* =====================================
   جلوگیری از دوبار اجرا شدن
   روی موبایل
===================================== */

/*
   عمداً touchstart نداریم.

   رویداد click روی موبایل
   خودش اجرا می‌شود و بنابراین
   هر لمس فقط یک دیالوگ نشان می‌دهد.
*/


</script>

</body>

</html>
